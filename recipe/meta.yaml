{% set name = "perl-sub-quote" %}
{% set version = "2.006009" %}
{% set sha256 = "967282d54d2d51b198c67935594f93e4dea3e54d1e5bced158c94e29be868a4b" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Sub-Quote-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-test-fatal
  run:
    - perl

test:
  imports:
    - Sub::Defer
    - Sub::Quote

about:
  home: http://metacpan.org/pod/Sub-Quote
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'Efficient generation of subroutines via string eval'

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
